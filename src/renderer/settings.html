<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>桌宠设置</title>
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <main>
      <h1>桌宠设置</h1>
      <form id="settings-form">
        <label>
          <span>桌宠</span>
          <select id="character" name="character"></select>
        </label>

        <label>
          <span>桌宠大小</span>
          <select id="pet-scale" name="petScale"></select>
        </label>

        <label>
          <span>界面主题</span>
          <select id="theme" name="theme">
            <option value="light">浅色</option>
            <option value="dark">深色</option>
          </select>
        </label>

        <fieldset>
          <legend>默认位置</legend>
          <label class="choice">
            <input type="radio" name="defaultPosition" value="bottom-right" />
            <span>右下角</span>
          </label>
          <label class="choice">
            <input type="radio" name="defaultPosition" value="last" />
            <span>上次位置</span>
          </label>
        </fieldset>

        <label>
          <span>召唤快捷键</span>
          <input id="summon-shortcut" name="summonShortcut" required />
          <small>例如 CommandOrControl+Alt+P</small>
        </label>

        <fieldset class="ai-settings">
          <legend>AI 配置</legend>
          <label>
            <span>接口类型</span>
            <input value="OpenAI Compatible" readonly />
          </label>

          <label>
            <span>Base URL</span>
            <input id="ai-base-url" type="url" placeholder="https://api.openai.com/v1" />
          </label>

          <label>
            <span>Model</span>
            <input id="ai-model" placeholder="例如 gpt-4o-mini" />
          </label>

          <label>
            <span>API Key</span>
            <input id="ai-api-key" type="password" autocomplete="new-password" />
            <small id="ai-key-status">未配置</small>
          </label>

          <div class="ai-actions">
            <button id="test-ai" type="button">测试连接</button>
            <button id="remove-ai-key" type="button">删除 API Key</button>
          </div>
          <p id="ai-status" role="status"></p>
        </fieldset>

        <div class="actions">
          <p id="status" role="status"></p>
          <button type="submit">保存并应用</button>
        </div>
      </form>
    </main>
    <script type="module" src="../../dist/renderer-esm/renderer/settings.js"></script>
  </body>
</html>
